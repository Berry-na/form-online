<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="styles/logo_pianeta.jpg">   
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Sofia">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&family=Story+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="styles/style.css">

    <title>Eurovision</title>
  </head>
  <body>

    <div class="container">   
      <div class="fireworks-wrapper">
        <canvas id="canvas"></canvas>
        <h1 id="title">Classifica Eurovision</h1>
      </div>

      <div class="formSanremo" id="tabella">      
      </div>
    </div>
    
    <script src="https://unpkg.com/fireworks-js@2.x/dist/index.umd.js"></script>
    <script>      
      const url = "https://script.google.com/macros/s/AKfycbxi2ilqNcszu4V3HVdf5WhuvlZk0Vc7gKlAsIabKv8TDt8ihFd0KDQ5SPdco1YQT2Mhow/exec";

      function carica() {
        fetch(url)
          .then(response => response.json())
          .then(dati => mostra(dati));
      }

      function mostra(dati) {
        let html = "";

        dati.forEach((riga,i)=>{
          if(riga[1] != 0){
            html += `
            <div class="domanda">
              <p><b>${riga[0]}</b></p>
              <p>${riga[1]} punti</p>
            </div>
          `;
          }
        });

        document.getElementById("tabella").innerHTML = html;
      }

      carica();
      setInterval(carica,2000);

      //PER FUOCHI D'ARTIFICIO  ----------------------------------------------------------------------------------------------
    	const container = document.querySelector('.fireworks-wrapper');
    	const titolo = document.querySelector('#title');
    
    	// Inizializzazione con opzioni personalizzate
    	const fireworks = new Fireworks.default(container, {
    	  autoresize: true,
    	  opacity: 0.5,
    	  acceleration: 1.05,
    	  friction: 0.97,
    	  gravity: 1.5,
    	  particles: 50,
    	  traceLength: 3,
    	  explosion: 5,
    	  intensity: 30,
    	});
    
    	// 1. All'apertura della pagina: spara per 3 secondi e poi si ferma
    	fireworks.start();
    	setTimeout(() => fireworks.stop(), 3000);
    
    	// 2. Quando passi il mouse sopra il titolo
    	titolo.addEventListener('mouseenter', () => {
    	  fireworks.start();
    	});
    
    	// 3. Quando togli il mouse (opzionale: smette di sparare nuovi colpi)
    	titolo.addEventListener('mouseleave', () => {
    	  fireworks.stop();
    	});
    </script>
  </body>
</html>
